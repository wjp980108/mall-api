name: Deploy Spring Boot application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer commit supersedes any queued or in-progress deployment for this branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ARTIFACT_NAME: app.jar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Git may not retain the executable bit when this repository is edited
      # on Windows. GitHub-hosted runners execute the wrapper on Linux.
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build executable JAR
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      # Ship only the executable Spring Boot JAR. Runtime configuration and
      # logs remain on the server and are therefore not overwritten by rsync.
      - name: Prepare deployment artifact
        run: |
          mkdir -p deploy
          cp target/meet-back-*.jar "deploy/${ARTIFACT_NAME}"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-app
          path: deploy/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: spring-boot-app
          path: deploy/

      # Repository secrets required:
      # SERVER_HOST, SERVER_PORT, SERVER_USER, SERVER_TARGET, SSH_PRIVATE_KEY
      # Set SERVER_JAVA_BIN when Java is not on the SSH user's default PATH.
      - name: Upload JAR to server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz
          path: deploy/
          remote_path: ${{ secrets.SERVER_TARGET }}
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_port: ${{ secrets.SERVER_PORT }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # application-prod.yml stays on the server. SERVER_JAVA_BIN is used when
      # Java is not on the non-interactive SSH PATH.
      - name: Restart Spring Boot application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -u
            if ! cd "${{ secrets.SERVER_TARGET }}"; then
              echo "Cannot access the deployment directory. Check SERVER_TARGET and the SSH user's permissions."
              exit 1
            fi
            echo "Deployment directory: $(pwd)"

            java_bin="${{ secrets.SERVER_JAVA_BIN }}"
            if [ -n "$java_bin" ]; then
              if [ ! -x "$java_bin" ]; then
                echo "SERVER_JAVA_BIN is not an executable file: $java_bin"
                exit 1
              fi
            elif ! java_bin="$(command -v java)"; then
              echo "Java is not available to the non-interactive SSH shell. PATH: $PATH"
              echo "Set SERVER_JAVA_BIN to the absolute path of the Java 17 executable."
              exit 1
            fi
            echo "Using Java: $java_bin"
            "$java_bin" -version

            if [ ! -f app.jar ]; then
              echo "Missing app.jar in $(pwd)."
              exit 1
            fi

            set -e

            if [ ! -s application-prod.yml ]; then
              echo "Missing application-prod.yml in $(pwd)."
              echo "Create it on the server with the production database settings; it is intentionally not uploaded by this workflow."
              exit 1
            fi

            mkdir -p logs

            if [ -s app.pid ]; then
              previous_pid="$(cat app.pid)"
              case "$previous_pid" in
                *[!0-9]*|'')
                  echo "Ignoring invalid PID file: $previous_pid"
                  ;;
                *)
                  if kill -0 "$previous_pid" 2>/dev/null; then
                    previous_command="$(tr '\0' ' ' < "/proc/$previous_pid/cmdline" 2>/dev/null || true)"
                    if ! printf '%s' "$previous_command" | grep -q 'app.jar'; then
                      echo "PID file points to a live non-application process ($previous_pid); refusing to stop it."
                      exit 1
                    fi
                    echo "Stopping previous application process ($previous_pid)."
                    kill "$previous_pid" || true
                    for _ in $(seq 1 30); do
                      kill -0 "$previous_pid" 2>/dev/null || break
                      sleep 1
                    done
                    if kill -0 "$previous_pid" 2>/dev/null; then
                      echo "Previous application process did not stop."
                      exit 1
                    fi
                  fi
                  ;;
              esac
            fi

            nohup "$java_bin" -jar app.jar --spring.profiles.active=prod \
              --spring.config.additional-location=optional:file:./ > logs/app.log 2>&1 &
            app_pid=$!
            echo "$app_pid" > app.pid
            startup_timeout=90
            deadline=$(( $(date +%s) + startup_timeout ))
            while true; do
              if grep -q 'Started MeetBackApplication' logs/app.log && kill -0 "$app_pid" 2>/dev/null; then
                echo "Application started successfully (PID: $app_pid)."
                exit 0
              fi
              if ! kill -0 "$app_pid" 2>/dev/null || grep -q -E 'Application run failed|Error starting ApplicationContext' logs/app.log; then
                echo "Application failed during startup."
                tail -n 100 logs/app.log || true
                kill "$app_pid" 2>/dev/null || true
                exit 1
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                break
              fi
              sleep 2
            done

            # Check once more after the deadline so a successful final startup
            # check is not missed because of the polling interval.
            if grep -q 'Started MeetBackApplication' logs/app.log && kill -0 "$app_pid" 2>/dev/null; then
              echo "Application started successfully (PID: $app_pid)."
              exit 0
            fi

            echo "Application did not finish starting within ${startup_timeout} seconds."
            tail -n 100 logs/app.log || true
            kill "$app_pid" 2>/dev/null || true
            exit 1
