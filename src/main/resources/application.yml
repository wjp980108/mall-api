mybatis-plus:
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: isDeleted
      # 未删除值
      logic-not-delete-value: 0
      # 已删除值
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.atguigu.meet.model.entity

# 权限缓存配置
permission:
  # Redis 缓存前缀
  cache-prefix: "mall:permission:"
  # 缓存过期时间（秒），默认 1 小时
  expire-seconds: 3600



