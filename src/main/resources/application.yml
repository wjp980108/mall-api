# 上传文件通用（业务校验：后缀、大小限制）
upload:
  # 本地存储根目录（x-file-storage local-1 与 WebConfig 静态资源映射共用）
  # 线上 Linux 环境在对应 profile 或启动参数中覆盖，如 --upload.base-path=/data/upload/
  base-path: F:/upload/
  # 各业务上传配置
  type-config:
    # 头像
    avatar:
      sub-path: avatar/
      allow-suffix: jpg,jpeg,png
      max-size-mb: 2
    # 商品图片
    goods:
      sub-path: goods/
      allow-suffix: jpg,jpeg,png,webp
      max-size-mb: 5
    # 普通附件文档
    document:
      sub-path: document/
      allow-suffix: jpg,png,pdf,docx,xlsx,zip,rar
      max-size-mb: 10
    # 抢购场次背景图
    sessionBg:
      sub-path: session/bg/
      allow-suffix: jpg,jpeg,png,webp
      max-size-mb: 5
    # 托售商品缩略图
    consignCover:
      sub-path: consign/cover/
      allow-suffix: jpg,jpeg,png,webp
      max-size-mb: 2
    # 托售商品详情图
    consignDetail:
      sub-path: consign/detail/
      allow-suffix: jpg,jpeg,png,webp
      max-size-mb: 5
    # 通用文件(bizType 为空时默认)
    file:
      sub-path: file/
      allow-suffix: jpg,jpeg,png,webp,pdf,docx,xlsx,zip,rar
      max-size-mb: 10

# x-file-storage 文件存储配置
# 切换平台只需修改 default-platform 并添加对应平台配置，零代码改动
dromara:
  x-file-storage:
    default-platform: local-1
    # 本地存储
    local:
      - platform: local-1
        enable-storage: true
        base-path: ${upload.base-path}
        domain: /upload/
    # 阿里云 OSS（取消注释即可启用）
    # aliyun-oss:
