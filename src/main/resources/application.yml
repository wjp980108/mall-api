server:
  port: 9090
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB


jwt:
  SECRET_KEY_STR: f3yna73XNiDdLegXgx9f0HIRxvfX0a5ZH7uhzkPOIVk=
#  EXPIRE_TIME: 3600000
  EXPIRE_TIME: 360000000000
  security:
    public-paths:
      - /auth/login
